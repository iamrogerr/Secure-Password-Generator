<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="extensionName">Secure Password Generator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7.5" cy="15.5" r="5.5"/>
          <path d="m21 2-9.6 9.6"/>
          <path d="m15.5 7.5 3 3L22 7l-3-3"/>
        </svg>
        <h1 data-i18n="headerTitle">Password Generator</h1>
      </div>
    </header>

    <!-- Password Output Card -->
    <section class="password-card" aria-label="Generated password" data-i18n-aria-label="passwordCardLabel">
      <div class="password-wrapper" id="passwordWrapper" title="Click to copy" data-i18n-title="passwordWrapperTitle">
        <div class="password-display" id="passwordOutput" role="textbox" aria-readonly="true" tabindex="0">
          ...
        </div>
      </div>
      
      <div class="password-actions">
        <button type="button" id="copyBtn" class="action-btn copy-btn" title="Copy password" aria-label="Copy password">
          <svg class="btn-icon copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
          </svg>
          <svg class="btn-icon check-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          <span id="copyBtnText" data-i18n="copyBtn">Copy</span>
        </button>

        <button type="button" id="refreshBtn" class="action-btn refresh-btn" title="New password" aria-label="New password">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 21h5v-5"/>
          </svg>
          <span data-i18n="refreshBtn">New Password</span>
        </button>
      </div>

      <!-- Strength Meter -->
      <div class="strength-meter">
        <div class="strength-bar-bg">
          <div class="strength-bar-fill" id="strengthBar"></div>
        </div>
        <div class="strength-meta">
          <span class="strength-label" data-i18n="strengthLabel">Strength:</span>
          <span class="strength-value" id="strengthValue">Very Strong</span>
        </div>
      </div>
    </section>

    <!-- Configuration Options -->
    <section class="config-section" aria-label="Generation options">
      <!-- Length slider row -->
      <div class="length-row">
        <label for="lengthRange" class="control-title" data-i18n="lengthTitle">Length</label>
        <div class="slider-container">
          <input type="range" id="lengthRange" min="6" max="64" value="21" class="slider" aria-label="Adjust password length">
        </div>
        <div class="length-badge">
          <input type="number" id="lengthNumber" min="6" max="64" value="21" aria-label="Length in numbers">
        </div>
      </div>

      <!-- Compact 2-column options grid -->
      <div class="options-grid">
        <!-- Hyphen toggle spans both columns -->
        <label class="toggle-card span-2" for="optHyphen">
          <span class="toggle-name" data-i18n="optHyphenName">3 blocks with hyphen (-)</span>
          <div class="switch">
            <input type="checkbox" id="optHyphen" checked>
            <span class="slider-toggle"></span>
          </div>
        </label>

        <label class="toggle-card" for="optUppercase">
          <span class="toggle-name" data-i18n="optUppercaseName">Uppercase (A-Z)</span>
          <div class="switch">
            <input type="checkbox" id="optUppercase" checked>
            <span class="slider-toggle"></span>
          </div>
        </label>

        <label class="toggle-card" for="optLowercase">
          <span class="toggle-name" data-i18n="optLowercaseName">Lowercase (a-z)</span>
          <div class="switch">
            <input type="checkbox" id="optLowercase" checked>
            <span class="slider-toggle"></span>
          </div>
        </label>

        <label class="toggle-card" for="optNumbers">
          <span class="toggle-name" data-i18n="optNumbersName">Numbers (0-9)</span>
          <div class="switch">
            <input type="checkbox" id="optNumbers" checked>
            <span class="slider-toggle"></span>
          </div>
        </label>

        <label class="toggle-card" for="optSymbols">
          <span class="toggle-name" data-i18n="optSymbolsName">Symbols (!@#$)</span>
          <div class="switch">
            <input type="checkbox" id="optSymbols">
            <span class="slider-toggle"></span>
          </div>
        </label>
      </div>
    </section>

    <!-- Floating Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite">
      Password copied to clipboard!
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
